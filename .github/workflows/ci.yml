name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site:
    name: HTML and local links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check HTML documents and local targets
        run: python3 scripts/check_site.py
      - name: Check reviewed runtime dependencies
        run: python3 scripts/check_dependencies.py
      - name: Test dependency guard
        run: python3 -m unittest discover -s tests -p test_dependencies.py
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Restore locked editor build dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit editor dependencies
        run: npm audit --audit-level=low
      - name: Run editor policy tests
        run: npm test
      - name: Rebuild checked-in editor and notices
        run: npm run build:editor
      - name: Verify reproducible editor assets
        run: git diff --exit-code -- js/rich-editor.bundle.js docs/EDITOR-LICENSES.txt
